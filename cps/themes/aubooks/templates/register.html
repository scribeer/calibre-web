{% extends theme('layout.html') %}
{% block body %}
<div class="well col-sm-6 col-sm-offset-2">
  <h1 class="aubooks-page-title">{{_('Register New Account')}}</h1>
  <form method="POST" role="form" aria-describedby="register-help">
    <input type="hidden" name="csrf_token" value="{{csrf_token()}}">
    <div id="register-help" class="sr-only">{{_('Create a new account to access AU-Books')}}</div>
    <div class="form-group">
      <label for="name">{{_('Username')}}</label>
      <input type="text" class="form-control" id="name" name="name" autocomplete="username" autocapitalize="off" placeholder="{{_('Choose a username')}}" required aria-required="true">
    </div>
    <div class="form-group">
      <label for="email">{{_('Email')}}</label>
      <input type="email" class="form-control" id="email" name="email" autocomplete="email" placeholder="{{_('Your email address')}}" required aria-required="true">
    </div>
    <div class="form-group">
      <label for="password">{{_('Password')}}</label>
      <div class="input-group">
        <input type="password" class="form-control" id="password" name="password" autocomplete="new-password" placeholder="{{_('Create a password')}}" required aria-required="true">
        <span class="input-group-btn">
          <button type="button" class="btn btn-default toggle-password" data-target="#password" data-password-show="{{_('Show password')}}" data-password-hide="{{_('Hide password')}}" aria-label="{{_('Show password')}}" title="{{_('Show password')}}"><span class="glyphicon glyphicon-eye-close" aria-hidden="true"></span></button>
        </span>
      </div>
    </div>
    <div class="form-group">
      <label for="confirm_password">{{_('Confirm password')}}</label>
      <div class="input-group">
        <input type="password" class="form-control" id="confirm_password" name="confirm_password" autocomplete="new-password" placeholder="{{_('Repeat your password')}}" required aria-required="true">
        <span class="input-group-btn">
          <button type="button" class="btn btn-default toggle-password" data-target="#confirm_password" data-password-show="{{_('Show password')}}" data-password-hide="{{_('Hide password')}}" aria-label="{{_('Show password')}}" title="{{_('Show password')}}"><span class="glyphicon glyphicon-eye-close" aria-hidden="true"></span></button>
        </span>
      </div>
    </div>
    <button type="submit" class="btn btn-default">{{_('Register')}}</button>
    <p class="form-text" style="margin-top: 1em;"><a href="{{url_for('web.login')}}">{{_('Already have an account? Log in')}}</a></p>
  </form>
</div>
{% endblock %}
